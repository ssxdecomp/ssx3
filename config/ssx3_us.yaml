name: SSX 3 (2003) (USA)
sha1: 77114dfd1205eaccf1ccc18c5f9650097fa78bd8

options:
  basename: SLUS_207.72
  target_path: disc/SLUS_207.72
  elf_path: SLUS_207.72
  base_path: ../
  platform: ps2
  compiler: EEGCC

  asm_path: asm
  src_path: src/
  build_path: obj

  # Put 'hasm' splits in src/
  hasm_in_src_path: True

  rodata_string_guesser_level: 2

  find_file_boundaries: False
  disasm_unknown: True
  named_regs_for_c_funcs: False

  # This project hand-maintains include/include_asm.h (needs a SKIP_ASM guard
  # for the dual obj/target vs obj/current objdiff build, which splat's
  # generic auto-generated template doesn't have) plus include/macro.inc and
  # include/labels.inc, so don't let splat regenerate/overwrite them.
  generate_asm_macros_files: False

  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: config/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: config/undefined_syms_auto.txt

  symbol_addrs_path: [ config/symbol_addrs.txt, config/lib_symbol_addrs.txt, config/gap_symbol_addrs.txt ]

  extensions_path: tools/splat_ext

  section_order: [".text", ".vutext", ".data", ".rodata", ".lit4", ".sdata", ".sbss", ".bss"]
  auto_link_sections: [".data", ".rodata", ".bss"]

  subalign: 4

