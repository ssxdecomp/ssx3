      # .sbss (real ELF start 0x3a5c00) would go here, but splat's CommonSegSbss
      # (a CommonSegBss subclass) isn't handled by configure.py's build_stuff
      # dispatch, which breaks the ninja build. Leaving this range classified
      # as .sdata instead -- still correctly generic (non-float) data, just not
      # perfectly section-accurate for this small remaining tail.

